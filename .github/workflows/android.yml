name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync web assets
        run: npx cap sync android

      - name: Prepare Android resources
        run: node scripts/prepare-android.mjs

      # Keystore debug estável: permite atualizar o APK sem desinstalar o anterior.
      - name: Restore stable debug keystore
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SRC=$(ls android/app/build/outputs/apk/debug/app-debug.apk)
          cp "$SRC" "timer-ciclico-v${VERSION}.apk"
          echo "APK=timer-ciclico-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timer-ciclico-debug-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Upload APK no release (se houver tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
